name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      library:
        description: "Library to publish"
        type: choice
        options: [production, demo]
        default: production

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install converter deps
        run: pip install -r tools/converter/requirements.txt
      - name: Converter tests (synthetic-only; no ANTHROPIC_API_KEY in CI)
        run: python -m pytest tests -q
        working-directory: tools/converter
      - name: Build (production library)
        if: ${{ inputs.library != 'demo' }}
        run: npm run build
      - name: Build (synthetic demo library)
        if: ${{ inputs.library == 'demo' }}
        run: npm run build:demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
