name: test

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install converter deps
        run: pip install -r tools/converter/requirements.txt
      - name: Converter tests (synthetic-only; no ANTHROPIC_API_KEY in CI)
        run: python -m pytest tests -q
        working-directory: tools/converter
      - run: npm run validate
      - run: npm run validate:fixtures
      - run: npm run build
